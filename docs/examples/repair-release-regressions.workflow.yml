name: Sonant repair release regressions
"on":
  create:

permissions:
  contents: read

concurrency:
  group: sonant-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_COMMIT: REPLACE_WITH_IMMUTABLE_REPAIR_SOURCE_COMMIT

jobs:
  quality:
    if: >-
      github.event_name == 'create' && github.event.ref_type == 'branch' &&
      github.repository == 'alvarovillalbaa/sonant' &&
      github.event.repository.private == false &&
      github.event.ref == 'qa/sonant-release-regression-20261104' &&
      github.ref == 'refs/heads/qa/sonant-release-regression-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the immutable repair pin
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Verify the immutable checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:site
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium firefox webkit
      - name: Provide a virtual audio device for headless Firefox
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          # norewinds caps the null sink at 50 ms instead of its 2-second default.
          pactl load-module module-null-sink sink_name=sonant norewinds=1
          pactl set-default-sink sonant
          pactl list short sinks
      - run: npm run test:e2e
      - name: Verify repeated Firefox cold starts
        run: npm run test:e2e -- --project firefox --grep "catalog renders" --repeat-each 5 --workers 1 --output cold-start-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            cold-start-results/
          retention-days: 7
      - run: npm pack --dry-run --workspace @alvarovillalbaa/sonant
      - name: Verify tracked source stayed unchanged
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          git diff --check
          git diff --no-ext-diff --no-textconv --exit-code HEAD --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
# Inactive full-release regression example. Root pins the immutable repair
# source in its active copy before creating qa/sonant-release-regression-20261104.
# The existing quality workflow, package inputs and browser configuration stay unchanged.
