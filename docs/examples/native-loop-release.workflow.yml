# Inactive; the owned activation copy pins SOURCE_COMMIT.
name: Temporary Sonant mobile layout diagnostic
on:
  create:
permissions:
  contents: read
jobs:
  quality:
    if: github.repository == 'alvarovillalbaa/sonant' && github.event.repository.private == false && github.event.ref_type == 'branch' && github.event.ref == 'qa/sonant-loop-layout-20261111-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_COMMIT: APPROVED_SOURCE_COMMIT
    steps:
      - name: Define owned proof path on the runner
        shell: bash
        run: printf 'SONANT_LOOP_PROOF=%s/sonant-loop-release\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          fetch-depth: 1
          clean: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          package-manager-cache: false
      - name: Bind exact original source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          mkdir -m 700 "$SONANT_LOOP_PROOF"
          cat > "$SONANT_LOOP_PROOF/source-guard.py" <<'PY'
          import hashlib,json,pathlib,subprocess,sys
          rows=[]
          for item in subprocess.check_output(['git','ls-files','--stage','-z']).split(b'\0'):
              if not item: continue
              meta,raw=item.split(b'\t',1);mode,blob,stage=meta.decode().split();name=raw.decode()
              p=pathlib.Path(name);data=p.read_bytes()
              assert stage=='0' and mode in ('100644','100755') and not p.is_symlink()
              assert bool(p.stat().st_mode & 0o111)==(mode=='100755')
              assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()==blob
              rows.append({'path':name,'mode':mode,'blob':blob,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          pathlib.Path(sys.argv[1]).write_text(json.dumps(rows,indent=2)+'\n')
          PY
          python3 "$SONANT_LOOP_PROOF/source-guard.py" "$SONANT_LOOP_PROOF/source-before.json"
          node --version > "$SONANT_LOOP_PROOF/node.txt"
          npm --version > "$SONANT_LOOP_PROOF/npm.txt"
      - name: Frozen installation
        shell: bash
        run: |
          set -euo pipefail
          npm ci 2>&1 | tee "$SONANT_LOOP_PROOF/install.log"
      - name: Package and site checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check 2>&1 | tee "$SONANT_LOOP_PROOF/check.log"
          npm run build:site 2>&1 | tee "$SONANT_LOOP_PROOF/build.log"
      - name: Chromium tools only
        shell: bash
        run: |
          set -euo pipefail
          node node_modules/@playwright/test/cli.js install --with-deps chromium 2>&1 | tee "$SONANT_LOOP_PROOF/browser-install.log"
      - name: One mobile layout diagnostic with unchanged assertions
        shell: bash
        run: node node_modules/@playwright/test/cli.js test --project mobile --grep "native progress loop" --workers 1 --reporter=json > "$SONANT_LOOP_PROOF/playwright.json" 2> "$SONANT_LOOP_PROOF/playwright.stderr.log"
      - name: Always verify source unchanged
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          python3 "$SONANT_LOOP_PROOF/source-guard.py" "$SONANT_LOOP_PROOF/source-after.json"
          cmp "$SONANT_LOOP_PROOF/source-before.json" "$SONANT_LOOP_PROOF/source-after.json"
          git diff --check
          git diff --exit-code HEAD --
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sonant-loop-layout-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/sonant-loop-release
            test-results/
            cold-start-results/
          retention-days: 1
          if-no-files-found: error
