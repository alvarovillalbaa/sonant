# Inactive example; only the task activation copy receives the exact source pin.
name: Temporary Sonant registry metadata
on:
  create:
permissions:
  contents: read
jobs:
  metadata:
    if: github.repository == 'alvarovillalbaa/sonant' && github.event.repository.private == false && github.event.ref_type == 'branch' && github.event.ref == 'qa/sonant-registry-metadata-20261111-1'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      SOURCE_COMMIT: APPROVED_SOURCE_COMMIT
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
          fetch-depth: 1
          clean: false
      - name: Read only anonymous public metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib,subprocess,urllib.request,urllib.parse
          source=os.environ['SOURCE_COMMIT']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==source
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'sonant-registry-metadata'
          root.mkdir(mode=0o700)
          report={'source':source,'startedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'passed':False,'authenticated':False,'registryWrite':False}
          def guard(name):
              assert not subprocess.check_output(['git','status','--porcelain','--untracked-files=all'])
              rows=[]
              for item in subprocess.check_output(['git','ls-files','--stage','-z']).split(b'\0'):
                  if not item:continue
                  meta,raw=item.split(b'\t',1);mode,blob,stage=meta.decode().split();p=pathlib.Path(raw.decode());data=p.read_bytes()
                  assert stage=='0' and mode in ('100644','100755') and not p.is_symlink()
                  assert bool(p.stat().st_mode & 0o111)==(mode=='100755')
                  assert hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()==blob
                  rows.append({'path':str(p),'mode':mode,'blob':blob,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
              (root/name).write_text(json.dumps(rows,indent=2)+'\n')
              return rows
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):raise RuntimeError('unexpected registry redirect')
          try:
              before=guard('source-before.json')
              url='https://registry.npmjs.org/@alvarovillalbaa%2fsonant'
              request=urllib.request.Request(url,headers={'Accept':'application/json','User-Agent':'sonant-release-preflight','Cache-Control':'no-cache'})
              with urllib.request.build_opener(NoRedirect()).open(request,timeout=15) as response:
                  report['status']=response.status;report['url']=response.geturl()
                  assert response.status==200 and response.geturl()==url
                  raw=response.read(524289);assert len(raw)<=524288 and response.read(1)==b''
                  report['bodyComplete']=True
              report['responseClosed']=response.closed
              assert report['responseClosed']
              (root/'registry-original.json').write_bytes(raw)
              report['responseBytes']=len(raw);report['responseSha256']=hashlib.sha256(raw).hexdigest()
              data=json.loads(raw);assert data['name']=='@alvarovillalbaa/sonant' and isinstance(data['versions'],dict)
              latest=data['dist-tags']['latest'];published=data['versions'][latest]
              report.update(latest=latest,versions=sorted(data['versions']),candidate='0.1.1',candidateAvailable='0.1.1' not in data['versions'],maintainers=data.get('maintainers',[]),latestDist=published['dist'],sourcePackageVersion=json.loads(pathlib.Path('packages/sonant/package.json').read_text())['version'])
              report['passed']=True
          except Exception as error:report['error']=str(error)[:1200]
          finally:
              try:
                  after=guard('source-after.json');assert after==before
                  report['sourceUnchanged']=True;report['sourceFiles']=len(after)
              except Exception as error:report['passed']=False;report['sourceError']=str(error)[:1200]
              report['finishedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat()
              (root/'report.json').write_text(json.dumps(report,indent=2)+'\n')
              print(json.dumps({k:v for k,v in report.items() if k not in ('latestDist','maintainers')}))
          raise SystemExit(0 if report['passed'] else 1)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sonant-registry-metadata-${{ github.run_id }}
          path: ${{ runner.temp }}/sonant-registry-metadata
          if-no-files-found: error
          retention-days: 1
